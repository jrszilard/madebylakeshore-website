<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2.5in" viewBox="0 0 1050 750" role="img" aria-labelledby="title desc">
  <title id="title">Dead People Wanted sticker concept v1 — business card ad</title>
  <desc id="desc">A conservative fake funeral home ad sticker with burgundy, cream, gold, slogan, QR placeholder, and URL.</desc>
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .smallcaps { font-family: Arial, Helvetica, sans-serif; text-transform: uppercase; letter-spacing: 6px; }
    </style>
    <pattern id="paper" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#F5EFE2"/>
      <circle cx="9" cy="14" r="1.2" fill="#D7C8AD" opacity="0.45"/>
      <circle cx="55" cy="48" r="1" fill="#D7C8AD" opacity="0.35"/>
      <circle cx="73" cy="21" r="0.8" fill="#8B1E2D" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1050" height="750" rx="28" fill="url(#paper)"/>
  <rect x="34" y="34" width="982" height="682" rx="16" fill="none" stroke="#2B1D1A" stroke-width="7"/>
  <rect x="55" y="55" width="940" height="640" rx="8" fill="none" stroke="#D9C08F" stroke-width="3"/>

  <g transform="translate(90 86)">
    <text class="smallcaps" x="0" y="0" font-size="28" fill="#8B1E2D">Family Owned Since Yesterday</text>
    <text class="serif" x="0" y="72" font-size="72" fill="#2B1D1A">Dead People Wanted</text>
    <text class="smallcaps" x="4" y="117" font-size="24" fill="#5E5548">Funeral Home &amp; Crematory</text>
  </g>

  <line x1="90" y1="245" x2="960" y2="245" stroke="#CBB99B" stroke-width="3"/>

  <g transform="translate(90 320)">
    <text class="serif" x="0" y="0" font-size="78" font-weight="700" fill="#2B1D1A">You’ve got dead people.</text>
    <text class="serif" x="0" y="86" font-size="78" font-weight="700" fill="#8B1E2D">We want dead people.</text>
    <text class="serif" x="2" y="154" font-size="34" fill="#5E5548">Immediate need? Recently deceased?</text>
    <text class="serif" x="2" y="199" font-size="34" fill="#5E5548">We’re here to receive.</text>
  </g>

  <g transform="translate(90 548)">
    <rect x="0" y="0" width="120" height="120" fill="#FFFFFF" stroke="#2B1D1A" stroke-width="5"/>
    <rect x="13" y="13" width="21" height="21" fill="#2B1D1A"/><rect x="40" y="13" width="21" height="21" fill="#2B1D1A"/><rect x="67" y="13" width="21" height="21" fill="#2B1D1A"/>
    <rect x="13" y="40" width="21" height="21" fill="#2B1D1A"/><rect x="67" y="40" width="21" height="21" fill="#2B1D1A"/><rect x="94" y="40" width="16" height="16" fill="#2B1D1A"/>
    <rect x="13" y="67" width="21" height="21" fill="#2B1D1A"/><rect x="40" y="67" width="21" height="21" fill="#2B1D1A"/><rect x="94" y="67" width="16" height="16" fill="#2B1D1A"/>
    <rect x="13" y="94" width="21" height="16" fill="#2B1D1A"/><rect x="67" y="94" width="21" height="16" fill="#2B1D1A"/><rect x="94" y="94" width="16" height="16" fill="#2B1D1A"/>
    <text class="smallcaps" x="150" y="30" font-size="21" fill="#8B1E2D">Scan for immediate arrangements</text>
    <text class="sans" x="150" y="76" font-size="38" font-weight="700" fill="#2B1D1A">fattamano.com/wewantdeadpeople</text>
    <text class="sans" x="150" y="112" font-size="20" fill="#5E5548">QR placeholder — replace with real scannable code before print</text>
  </g>

  <g transform="translate(800 92)">
    <circle cx="70" cy="58" r="52" fill="none" stroke="#D9C08F" stroke-width="5"/>
    <path d="M70 22 C96 51 90 86 70 103 C50 86 44 51 70 22Z" fill="#8B1E2D"/>
    <path d="M70 44 C82 62 78 80 70 89 C62 80 58 62 70 44Z" fill="#F5EFE2" opacity="0.88"/>
  </g>

  <text class="smallcaps" x="90" y="692" font-size="15" fill="#8B1E2D">A Real Fake Ad • Not a real funeral home</text>
  <text class="smallcaps" x="710" y="692" font-size="15" fill="#5E5548">24/7 Immediate Need*</text>
</svg>
