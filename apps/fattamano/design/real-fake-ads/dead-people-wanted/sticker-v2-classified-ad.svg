<svg xmlns="http://www.w3.org/2000/svg" width="4in" height="2in" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Dead People Wanted sticker concept v2 — classified ad</title>
  <desc id="desc">A fake local classifieds funeral home sticker with bold headline, service copy, coupon border, and QR placeholder.</desc>
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .caps { font-family: Arial, Helvetica, sans-serif; text-transform: uppercase; letter-spacing: 4px; }
    </style>
    <pattern id="newsprint" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#F8F1E4"/>
      <path d="M0 22H44" stroke="#D7C8AD" stroke-width="1" opacity="0.24"/>
      <path d="M22 0V44" stroke="#D7C8AD" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" rx="22" fill="url(#newsprint)"/>
  <rect x="26" y="26" width="1148" height="548" fill="none" stroke="#2B1D1A" stroke-width="8" stroke-dasharray="28 14"/>
  <rect x="58" y="58" width="1084" height="484" fill="#FFFDF7" stroke="#8B1E2D" stroke-width="4"/>

  <g transform="translate(86 92)">
    <rect x="0" y="0" width="660" height="44" fill="#8B1E2D"/>
    <text class="caps" x="22" y="30" font-size="18" fill="#FFFFFF">Local end-of-life services • paid advertisement</text>

    <text class="serif" x="0" y="122" font-size="54" font-weight="700" fill="#2B1D1A">DEAD PEOPLE WANTED</text>
    <text class="serif" x="0" y="196" font-size="45" font-weight="700" fill="#8B1E2D">You’ve got dead people.</text>
    <text class="serif" x="0" y="248" font-size="45" font-weight="700" fill="#8B1E2D">We want dead people.</text>

    <text class="sans" x="2" y="310" font-size="25" fill="#3C332B">Funeral Home • Crematory • Transfer Services</text>
    <text class="sans" x="2" y="350" font-size="25" fill="#3C332B">Quiet vehicles. Dignified paperwork. Heat-based closure.</text>

    <g transform="translate(0 402)">
      <rect x="0" y="0" width="330" height="52" fill="#2B1D1A"/>
      <text class="caps" x="18" y="35" font-size="21" fill="#D9C08F">Call 1-800-DEAD-YES</text>
      <rect x="352" y="0" width="350" height="52" fill="none" stroke="#2B1D1A" stroke-width="3"/>
      <text class="caps" x="370" y="35" font-size="18" fill="#2B1D1A">Family Owned Since Yesterday</text>
    </g>
  </g>

  <g transform="translate(835 92)">
    <rect x="0" y="0" width="250" height="400" fill="#F8F1E4" stroke="#2B1D1A" stroke-width="5"/>
    <rect x="32" y="30" width="186" height="186" fill="#FFFFFF" stroke="#2B1D1A" stroke-width="5"/>
    <rect x="52" y="50" width="28" height="28" fill="#2B1D1A"/><rect x="88" y="50" width="28" height="28" fill="#2B1D1A"/><rect x="124" y="50" width="28" height="28" fill="#2B1D1A"/><rect x="168" y="50" width="18" height="18" fill="#2B1D1A"/>
    <rect x="52" y="86" width="28" height="28" fill="#2B1D1A"/><rect x="124" y="86" width="28" height="28" fill="#2B1D1A"/><rect x="168" y="86" width="28" height="28" fill="#2B1D1A"/>
    <rect x="52" y="122" width="28" height="28" fill="#2B1D1A"/><rect x="88" y="122" width="28" height="28" fill="#2B1D1A"/><rect x="168" y="122" width="28" height="28" fill="#2B1D1A"/>
    <rect x="52" y="166" width="28" height="28" fill="#2B1D1A"/><rect x="124" y="166" width="28" height="28" fill="#2B1D1A"/><rect x="160" y="160" width="18" height="18" fill="#2B1D1A"/><rect x="190" y="190" width="18" height="18" fill="#2B1D1A"/>

    <text class="caps" x="125" y="262" text-anchor="middle" font-size="20" fill="#8B1E2D">Scan for arrangements</text>
    <text class="sans" x="125" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#2B1D1A">fattamano.com</text>
    <text class="sans" x="125" y="348" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1D1A">/wewantdeadpeople</text>
    <text class="sans" x="125" y="382" text-anchor="middle" font-size="17" fill="#5E5548">QR placeholder</text>
  </g>

</svg>
