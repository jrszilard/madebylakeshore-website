<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real Fake Ads meta sticker concepts</title>
  <style>
    body { margin: 0; background: #f5efe8; color: #151515; font-family: Arial, Helvetica, sans-serif; }
    header { padding: 32px; border-bottom: 3px solid #151515; background: #ffd83d; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 5rem); line-height: .9; letter-spacing: -.05em; }
    p { max-width: 760px; line-height: 1.45; }
    main { padding: 28px; display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    figure { margin: 0; border: 3px solid #151515; background: white; box-shadow: 8px 8px 0 #151515; padding: 16px; }
    img { display: block; width: 100%; height: 360px; object-fit: contain; background: #f8f1e8; }
    figcaption { margin-top: 12px; font-family: 'Courier New', monospace; font-weight: 700; font-size: .86rem; }
  </style>
</head>
<body>
  <header>
    <h1>Real Fake Ads<br>meta sticker concepts</h1>
    <p>Different formats from the first QR/business-card stickers. Core joke: the customer pays to become ad inventory for a fake company.</p>

  <main>
    <figure><img src="real-fake-ads-street-team-badge.svg" alt="Real Fake Ads street team badge"><figcaption>real-fake-ads-street-team-badge.svg</figcaption></figure>
    <figure><img src="oops-all-compliance-cereal-prize.svg" alt="Oops All Compliance cereal prize"><figcaption>oops-all-compliance-cereal-prize.svg</figcaption></figure>
    <figure><img src="burialcoin-tombstone-token.svg" alt="BurialCoin tombstone token"><figcaption>burialcoin-tombstone-token.svg</figcaption></figure>
    <figure><img src="model-citizen-ai-laptop-badge.svg" alt="Model Citizen AI laptop badge"><figcaption>model-citizen-ai-laptop-badge.svg</figcaption></figure>
    <figure><img src="sight-unseen-aerials-ground-crew.svg" alt="Sight Unseen Aerials ground crew patch"><figcaption>sight-unseen-aerials-ground-crew.svg</figcaption></figure>
    <figure><img src="samedeck-deck-sponsor-label.svg" alt="SameDeck deck sponsor label"><figcaption>samedeck-deck-sponsor-label.svg</figcaption></figure>
    <figure><img src="dead-people-yard-sign-mini.svg" alt="Dead People Wanted mini yard sign"><figcaption>dead-people-yard-sign-mini.svg</figcaption></figure>
  </main>
</body>
</html>
